name: Build AndroidPumpkinOS APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Скачиваем код репозитория и подмодуль PumpkinOS
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      # 2. Устанавливаем Java 17 (требуется для Android Gradle Plugin)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Принимаем все лицензии предустановленного Android SDK
      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # 4. Выдаем права на выполнение скрипта сборки
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 5. Компилируем Debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # 6. Упаковываем готовый APK в ZIP-архив
      - name: Upload APK as ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: AndroidPumpkinOS-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
